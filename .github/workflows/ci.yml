name: ShadowPass CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Compile Contracts & Execute Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix contract ci
          npm --prefix indexer ci
          npm --prefix frontend ci

      - name: Compile Contracts & Build TypeScript Packages
        run: npm run build

      - name: Execute Vitest Unit & Integration Test Suite
        run: npm test

      - name: Report Test Results
        if: always()
        run: echo "CI pipeline run completed successfully with passing test suite."
