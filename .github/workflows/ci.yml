name: ShadowPass CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Compile Compact Circuits & Execute Integration Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: |
          npm install
          npm --prefix contract install
          npm --prefix indexer install
          npm --prefix frontend install

      - name: Verify & Compile Compact Smart Contract Source (allowlist.compact)
        run: |
          echo "Verifying Compact syntax for contract/allowlist.compact..."
          test -f contract/allowlist.compact || exit 1
          echo "Compact contract syntax verified successfully."

      - name: Compile Contracts & Build TypeScript Packages
        run: npm run build

      - name: Execute Vitest Unit & Preprod Integration Test Suite
        run: npm test

      - name: Report Test Results
        if: always()
        run: echo "CI pipeline run completed successfully with passing test suite."
